<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1220; --ink-2:#171C2E; --rail:#2A3350;
    --paper:#F4EFE6; --dim:#8891AC; --amber:#E9A93C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #161C33 0%, var(--ink) 60%);
    color:var(--paper);
    font-family:Archivo,system-ui,sans-serif;
    display:grid; grid-template-rows:auto 1fr auto auto; height:100%;
    -webkit-font-smoothing:antialiased;
  }

  .toprail{
    display:flex;justify-content:space-between;align-items:center;
    padding:1.1rem 2rem;border-bottom:1px solid var(--rail);
    font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  }
  .toprail .code{color:var(--amber)}
  .toprail .count{font-variant-numeric:tabular-nums}

  /* ---- stage: the newest message holds the floor ---- */
  .stage{
    display:flex;align-items:center;justify-content:center;
    padding:2.5rem 6vw;min-height:0;
  }
  .stage p{
    margin:0;max-width:20ch;text-align:center;
    font-family:Fraunces,Georgia,serif;font-weight:400;
    font-variation-settings:'SOFT' 60,'WONK' 1,'opsz' 120;
    font-size:clamp(2.2rem,6.5vw,6rem);line-height:1.02;
    text-wrap:balance;
  }
  .stage p.enter{animation:rise .62s cubic-bezier(.16,.9,.3,1) both}
  .stage .idle{color:var(--dim);font-size:clamp(1.4rem,3vw,2.4rem);max-width:24ch}
  @keyframes rise{
    from{opacity:0;transform:translateY(22px) scale(.96)}
    to  {opacity:1;transform:none}
  }

  /* ---- bed: everything that already had its turn ---- */
  .bed{
    display:grid;gap:.6rem;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    padding:0 2rem 1.5rem;
    max-height:38vh;overflow:hidden;align-content:start;
  }
  .card{
    background:var(--ink-2);
    border:1px solid var(--rail);
    border-left:3px solid var(--tint,var(--rail));
    border-radius:10px;padding:.65rem .8rem;
    font-size:clamp(.85rem,1.1vw,1.05rem);line-height:1.3;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  }
  .card.settle{animation:settle .5s cubic-bezier(.16,.9,.3,1) both}
  @keyframes settle{
    from{opacity:0;transform:translateY(-14px) scale(1.03)}
    to  {opacity:1;transform:none}
  }

  /* ---- join rail: always visible, latecomers can still get in ---- */
  .join{
    display:flex;align-items:center;gap:1.4rem;
    padding:1rem 2rem;border-top:1px solid var(--rail);background:rgba(0,0,0,.25);
  }
  .join canvas{
    width:82px;height:82px;border-radius:8px;background:var(--paper);padding:6px;
  }
  .join .label{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .join .url{
    font-family:Fraunces,Georgia,serif;font-size:clamp(1.1rem,2.2vw,1.8rem);
    font-variation-settings:'SOFT' 40,'WONK' 1;
  }
  .join .url b{color:var(--amber);font-weight:400}
  .hint{margin-left:auto;font-size:.72rem;color:var(--dim);text-align:right;max-width:22ch}

  @media (prefers-reduced-motion:reduce){
    .stage p.enter,.card.settle{animation:none}
  }
</style>
</head>
<body>

<div class="toprail">
  <span class="code" id="codeLabel"></span>
  <span class="count"><span id="count">0</span> messages</span>
</div>

<div class="stage" id="stage">
  <p class="idle" id="stageText">Waiting for the first one.</p>
</div>

<div class="bed" id="bed"></div>

<div class="join">
  <canvas id="qr" width="82" height="82"></canvas>
  <div>
    <div class="label">Join in</div>
    <div class="url" id="joinUrl"></div>
  </div>
  <div class="hint" id="hint">Backspace pulls the message on stage.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg = window.TEXTWALL;
  var db  = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  var params  = new URLSearchParams(location.search);
  var session = (params.get('s') || '').trim().toLowerCase();

  var stage     = document.getElementById('stage');
  var bed       = document.getElementById('bed');
  var countEl   = document.getElementById('count');
  var hintEl    = document.getElementById('hint');

  if(!session){
    document.getElementById('stageText').textContent = 'Add ?s=your-room-code to this URL.';
    return;
  }

  document.getElementById('codeLabel').textContent = session;

  // Join rail
  var joinUrl = 'https://' + cfg.PUBLIC_HOST + '/?s=' + encodeURIComponent(session);
  document.getElementById('joinUrl').innerHTML =
    cfg.PUBLIC_HOST + '/?s=<b>' + session + '</b>';
  QRCode.toCanvas(document.getElementById('qr'), joinUrl,
    { margin:0, width:82, color:{ dark:'#0E1220', light:'#F4EFE6' } });

  // Each message gets one of a few muted tints so the bed reads as many voices.
  var TINTS = ['#E9A93C','#7FA8D9','#D98CA6','#8FBF9F','#B79BDB'];
  function tintFor(id){
    var n = 0; for(var i=0;i<id.length;i++) n = (n*31 + id.charCodeAt(i)) >>> 0;
    return TINTS[n % TINTS.length];
  }

  var BED_MAX = 24;
  var total = 0;
  var onStage = null;

  function toBed(msg, animate){
    var card = document.createElement('div');
    card.className = 'card' + (animate ? ' settle' : '');
    card.style.setProperty('--tint', tintFor(msg.id));
    card.textContent = msg.body;
    card.dataset.id = msg.id;
    bed.prepend(card);
    while(bed.children.length > BED_MAX) bed.lastChild.remove();
  }

  function show(msg, animate){
    if(onStage) toBed(onStage, animate);
    onStage = msg;
    var p = document.createElement('p');
    if(animate) p.className = 'enter';
    p.textContent = msg.body;
    stage.replaceChildren(p);
  }

  function bump(n){ total = n; countEl.textContent = total; }

  // Backfill so the wall is never blank
  db.from('messages')
    .select('id,body,created_at')
    .eq('session', session).eq('status','open').is('owner', null)
    .order('created_at', { ascending:false })
    .limit(BED_MAX + 1)
    .then(function(res){
      var rows = res.data || [];
      bump(rows.length);
      if(rows.length){
        show(rows[0], false);
        for(var i = rows.length - 1; i >= 1; i--) toBed(rows[i], false);
      }
    });

  // Live
  db.channel('wall-' + session)
    .on('postgres_changes',
      { event:'INSERT', schema:'public', table:'messages', filter:'session=eq.' + session },
      function(payload){
        if(payload.new.owner) return;
        show(payload.new, true);
        bump(total + 1);
      })
    .on('postgres_changes',
      { event:'DELETE', schema:'public', table:'messages' },
      function(payload){
        var gone = payload.old && payload.old.id;
        if(!gone) return;
        var card = bed.querySelector('[data-id="' + gone + '"]');
        if(card) card.remove();
      })
    .subscribe();

  // Kill switch. Only works if you are signed in on this machine
  // (sign in once at /inbox.html — the session is shared across the site).
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Backspace' || !onStage) return;
    e.preventDefault();
    var id = onStage.id;
    db.from('messages').delete().eq('id', id).then(function(res){
      if(res.error){
        hintEl.textContent = 'Sign in at /inbox.html on this machine to pull messages.';
        return;
      }
      onStage = null;
      stage.replaceChildren(
        Object.assign(document.createElement('p'), { className:'idle', textContent:'Pulled.' })
      );
      bump(Math.max(0, total - 1));
    });
  });
})();
</script>
</body>
</html>
