<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Say something</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1220; --ink-2:#171C2E; --rail:#2A3350;
    --paper:#F4EFE6; --dim:#8891AC; --amber:#E9A93C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink); color:var(--paper);
    font-family:Archivo,system-ui,sans-serif;
    display:flex; flex-direction:column;
    padding:max(1.25rem,env(safe-area-inset-top)) 1.25rem max(1.25rem,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
  .eyebrow{
    font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  }
  .session{color:var(--amber)}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.25rem}
  h1{
    font-family:Fraunces,Georgia,serif;font-weight:400;
    font-variation-settings:'SOFT' 40,'WONK' 1;
    font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.05;margin:0;
  }
  textarea{
    width:100%;min-height:9rem;resize:none;
    background:var(--ink-2);color:var(--paper);
    border:1px solid var(--rail);border-radius:14px;
    padding:1rem;font:inherit;font-size:1.15rem;line-height:1.4;
  }
  textarea:focus{outline:2px solid var(--amber);outline-offset:2px;border-color:transparent}
  .row{display:flex;align-items:center;gap:1rem}
  .count{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
  button{
    flex:1;padding:1.05rem 1rem;border:0;border-radius:14px;
    background:var(--amber);color:#1A1206;
    font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;
  }
  button:disabled{background:var(--rail);color:var(--dim);cursor:default}
  button:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  .note{font-size:.85rem;color:var(--dim);min-height:1.4em}
  .note.ok{color:var(--amber)}
  .note.err{color:#F08A7E}
  footer{font-size:.75rem;color:var(--dim);text-align:center}
</style>
</head>
<body>
<header>
  <span class="eyebrow">Live wall</span>
  <span class="eyebrow session" id="sessionLabel"></span>
</header>

<main>
  <h1 id="prompt">Type something. It goes up on the screen.</h1>
  <textarea id="body" maxlength="280" placeholder="Say it here" autocomplete="off"></textarea>
  <div class="row">
    <span class="count"><span id="count">0</span>/280</span>
    <button id="send">Send to the screen</button>
  </div>
  <p class="note" id="note" role="status" aria-live="polite"></p>
</main>

<footer>Anyone in the room can see what you send.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg = window.TEXTWALL;
  var db  = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  var params  = new URLSearchParams(location.search);
  var session = (params.get('s') || '').trim().toLowerCase();

  var bodyEl = document.getElementById('body');
  var sendEl = document.getElementById('send');
  var noteEl = document.getElementById('note');
  var cntEl  = document.getElementById('count');

  if(!session){
    document.getElementById('prompt').textContent = 'This link is missing its room code.';
    bodyEl.disabled = true; sendEl.disabled = true;
    noteEl.textContent = 'Scan the code on the screen to join.';
    return;
  }
  document.getElementById('sessionLabel').textContent = session;

  bodyEl.addEventListener('input', function(){
    cntEl.textContent = bodyEl.value.length;
    noteEl.textContent = '';
    noteEl.className = 'note';
  });

  var lastSent = 0;

  function send(){
    var text = bodyEl.value.trim();
    if(!text) return;
    if(Date.now() - lastSent < 3000){
      noteEl.textContent = 'Give it a few seconds between messages.';
      noteEl.className = 'note err';
      return;
    }
    sendEl.disabled = true;
    sendEl.textContent = 'Sending';

    db.from('messages').insert({ session: session, body: text }).then(function(res){
      sendEl.disabled = false;
      sendEl.textContent = 'Send to the screen';
      if(res.error){
        noteEl.textContent = 'That did not go through. Try again.';
        noteEl.className = 'note err';
        return;
      }
      lastSent = Date.now();
      bodyEl.value = '';
      cntEl.textContent = '0';
      noteEl.textContent = 'It is on the screen.';
      noteEl.className = 'note ok';
      bodyEl.focus();
    });
  }

  sendEl.addEventListener('click', send);
  bodyEl.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter') send();
  });
})();
</script>
</body>
</html>
